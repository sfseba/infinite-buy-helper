name: 오늘의 주문 알림

on:
  schedule:
    # 월~금 23:07 UTC = 한국 시간 화~토 08:07 (미국장 마감 후)
    - cron: '7 23 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-orders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 오늘 주문 계산 + 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot/daily.mjs

      - name: 장부(state.json) 저장
        run: |
          if git diff --quiet data/state.json; then
            echo "변경 없음"
          else
            git config user.name  "infinite-buy-bot"
            git config user.email "infinite-buy-bot@users.noreply.github.com"
            git add data/state.json
            git commit -m "bot: 장부 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="⚠️ 무한매수 도우미 실행이 실패했어요. 오늘 주문은 웹 계산기로 직접 계산해 주세요. 로그: ${RUN_URL}" > /dev/null
          fi
